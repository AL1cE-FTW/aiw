[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-shorts"
version = "0.1.0"
description = "Twitch配信から盛り上がった場面を自動検出し、縦型ショート動画を生成するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]
all = ["faster-whisper>=1.0", "anthropic>=1.0"]

[project.scripts]
twitch-shorts = "twitch_shorts.cli:main"

[tool.setuptools.packages.find]
include = ["twitch_shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
