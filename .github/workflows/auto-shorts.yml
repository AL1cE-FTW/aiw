# 毎日、チャンネルの人気クリップを分析して検出設定を調整し、その設定で最新アーカイブから
# ショート動画を作って、動画と分析レポートを Artifacts にアップロードする。
# 使うには: リポジトリの Settings → Secrets and variables → Actions で
#   Secrets:   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET (任意: ANTHROPIC_API_KEY)
#   Variables: TWITCH_CHANNEL (省略時 yuuki_ftw)
name: Auto shorts

on:
  schedule:
    - cron: "7 21 * * *"   # 毎日 06:07 JST
  workflow_dispatch:
    inputs:
      vod:
        description: "処理する VOD の URL または ID (空なら最新アーカイブ)"
        required: false

concurrency: auto-shorts

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHANNEL: ${{ vars.TWITCH_CHANNEL || 'yuuki_ftw' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "::notice::TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET が未設定のためスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -e '.[llm]'
      - name: Restore processed VOD list and chat cache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            work/processed_vods.json
            work/vod_*/chat.jsonl
          key: work-${{ github.run_id }}
          restore-keys: work-
      - name: Analyze popular clips
        if: steps.check.outputs.skip != 'true'
        run: |
          # 分析に失敗してもショート作成は既定の設定で続ける
          if twitch-shorts analyze "$CHANNEL" --vods 2 -o output/analysis; then
            echo "TUNED=-c output/analysis/config.tuned.toml" >> "$GITHUB_ENV"
          fi
      - name: Make shorts
        if: steps.check.outputs.skip != 'true'
        env:
          VOD: ${{ github.event.inputs.vod }}
        run: |
          LLM_FLAG=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then LLM_FLAG="--llm"; fi
          if [ -n "$VOD" ]; then
            twitch-shorts $TUNED vod "$VOD" $LLM_FLAG
          else
            twitch-shorts $TUNED latest "$CHANNEL" --count 1 $LLM_FLAG
          fi
      - name: Drop large downloads before caching
        if: always() && steps.check.outputs.skip != 'true'
        run: rm -rf work/vod_*/audio.* work/vod_*/sections work/vod_*/video.*
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
